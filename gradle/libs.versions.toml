[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
browser = "1.9.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
serialization = "1.11.0"
okhttp = "5.5.0"
coil = "3.6.3"
# 图片查看器：缩放手势 + 大图子采样（0.19.0 提供 Coil 3 专用包）
telephoto = "0.19.0"
jsoup = "1.23.2"
miuix = "0.9.4"
datastorePreferences = "1.2.1"
reorderable = "3.1.0"
vico = "3.3.1"
# AboutLibraries：构建期收集依赖与许可证元数据（15.2.0 匹配 AGP 9 / Kotlin 2.4 / compile 37）
aboutLibs = "15.2.0"
# 平滑胶囊
shapes = "1.2.1"
# AI 回复的 Markdown 渲染（mikepenz，core + M3 主题 + Coil3 图片；0.46.0 与 Compose BOM 2026.09 兼容）
# 必须用 m3 变体：m2 变体内部引用 androidx.compose.material.MaterialTheme，
# 而本项目只有 Material3（M2 本体只被 icons/ripple 间接带入），运行时会 NoClassDefFoundError
markdownRenderer = "0.46.0"
# MCP 本地服务器：Ktor Server（CIO 引擎；只取 core + 引擎，Streamable HTTP 自行实现）
ktor = "3.6.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
# SplashScreen 兼容库：统一 Android 12+ 原生启动画面 API（含 keepOnScreenCondition）
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.2.0" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Jsoup：HTML 解析器（动态详情正文是 HTML，解析后映射成原生 Compose 组件渲染）
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Telephoto：全屏图片查看器的缩放/拖动，Coil 3 专用集成包
telephoto-coil3 = { group = "me.saket.telephoto", name = "zoomable-image-coil3", version.ref = "telephoto" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
# Vico：Compose 图表库（3.x 已将 core 并入 compose，仅用此模块即可；不引 m2/m3 以贴合 Miuix 主题）
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav-android", version.ref = "miuix" }
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
# AboutLibraries 核心：只取生成的依赖/许可证数据，UI 自己用 Miuix 画
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutLibs" }
# 平滑胶囊
shapes = { module = "io.github.kyant0:shapes", version.ref = "shapes" }
# mikepenz Markdown 渲染三件套：解析核心 / Material3 主题 Composable / Coil3 图片加载
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-coil3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-coil3", version.ref = "markdownRenderer" }
# Ktor Server（MCP 本地服务器）：core 提供路由与类型，cio 是纯 Kotlin 引擎
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
# OkHttp 官方测试服务器：AI SSE 流式解析的单测用（与 okhttp 同版本号发布）
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Android 专用变体：随 Android 构建自动生成 res/raw/aboutlibraries.json，无需手动跑 export 任务
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibs" }
