name: Build

# 构建流水线：PR / push 出 debug 包，push 到 master 额外出一对签名 release 包，
# 作为应用内「更新通道 = Actions 构建」的来源。
#
# ⚠️ 文件名 build.yml 是 App 侧的常量（GithubReleaseService.WORKFLOW_FILE）：
#    App 靠它查询「master 上最近一次成功的运行」。改名会让 run_number 从 1 重新计数，
#    已经装了 Actions 包的用户会认为「没有更新」，改名时务必同步改 Kotlin 常量。
on:
  push:
    branches: [master]
    tags-ignore: ['**']          # tag 推送交给 release.yml，避免一次发版跑两套流程
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支的旧构建让位给新提交；被取消的运行结论不是 success，不会出现在更新检查里
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 单测不在这里跑：本机开发时（含 AI agent）提交前自行跑 testStandard/LegacyDebugUnitTest 更快，
  # CI 只负责「代码能不能编出来、包能不能签出来」。
  # 代价：app/src/test/** 不再被 CI 编译，测试代码腐烂只有在本地跑测试时才会暴露。
  debug:
    name: Debug 包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x ./gradlew

      - name: 打两个 edition 的 debug 包
        run: >
          ./gradlew :app:assembleStandardDebug :app:assembleLegacyDebug
          --no-configuration-cache --stacktrace

      # 产物名只给人看：App 侧不下 artifact（要登录），只跳运行页面，所以改名不影响更新通道。
      # 命名格式：Afdian-<版本>-<类型>-b<构建号>-<短 sha>，版本号从 Gradle 产物文件名里取，
      # 与包内真实版本天然一致，不用再去解析 build.gradle.kts（里面是变量不是字面量）。
      - name: 生成产物名
        id: naming
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/standard/debug/Afdian-*-standard-debug.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::standard debug 产物应恰好 1 个，实际 ${#apks[@]} 个"
            exit 1
          fi
          file="${apks[0]##*/}"                     # Afdian-1.0.0-standard-debug.apk
          version="${file#Afdian-}"                 # 1.0.0-standard-debug.apk
          version="${version%-standard-debug.apk}"  # 1.0.0
          echo "name=Afdian-${version}-debug-b${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  actions-apk:
    name: 签名包（Actions 更新通道）
    # 只在 master 上产出：PR 拿不到 secrets，也不该出现在更新通道里。
    # workflow_dispatch 也放行（手动重跑一次构建），否则「成功但没有签名包」的运行
    # 会被 App 的 Runs 查询当成可用更新，用户点进去却找不到 APK。
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      # 缺 secret 必须硬失败：Gradle 侧缺 key 只会产出「未签名但构建成功」的包，
      # 用户装上去报「应用未安装」，比 CI 直接红掉难排查得多。
      - name: 校验签名 secrets
        run: |
          set -euo pipefail
          missing=()
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v:-}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 secrets: ${missing[*]}（配置方法见 README「CI 与发布」）"
            exit 1
          fi

      # storeFile 相对仓库根目录解析（app/build.gradle.kts 用 rootProject.file），
      # 因此密钥库必须落在仓库根，不能放子目录。
      - name: 还原 keystore 与 key.properties
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | tr -d '\n\r \t' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          test -s release.jks

      # -x lintVital*：assembleRelease 默认挂 lintVital（Lint 全项目分析），是 release 独有的
      # 大头开销（debug 完全不跑）。这里跳过，release 只负责「R8 压缩 + 打包 + 签名」；
      # Lint 交给本地/IDE，别让每次 CI 都为一个静态检查多等一两分钟。
      - name: 打签名包
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardRelease :app:assembleLegacyRelease \
            -x lintVitalStandardRelease -x lintVitalLegacyRelease \
            -PbuildNumber="${{ github.run_number }}" \
            -PbuildChannel=actions \
            -PgitSha="${GITHUB_SHA::7}" \
            --no-configuration-cache --stacktrace

      - name: 校验签名并整理产物
        run: |
          set -euo pipefail
          # 未匹配到文件时数组为空，而不是留下通配符字面量，方便下面判断个数
          shopt -s nullglob
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p dist
          for edition in standard legacy; do
            # APK 文件名由 Gradle 统一生成为 Afdian-<version>-<edition>-release.apk；
            # 这里直接按模式匹配构建产物，避免再去解析 build.gradle.kts（脚本变量/注入值都兼容）。
            matches=(app/build/outputs/apk/${edition}/release/Afdian-*-${edition}-release.apk)
            # 必须恰好 1 个：0 个说明没出包，多个说明混进了旧产物，都不该继续往下发
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::${edition} 构建产物应恰好 1 个，实际 ${#matches[@]} 个：${matches[*]:-（无）}"
              exit 1
            fi
            src_name="$(basename "${matches[0]}")"
            cp "${matches[0]}" "dist/${src_name/-${edition}-release.apk/-b${{ github.run_number }}-${edition}-release.apk}"
          done
          ls -l dist

          # ⚠️ apksigner verify 一次只接受一个 APK：把第二个文件传进去会被解析成
          #    「Unexpected parameter(s) after APK」并直接以 1 退出，所以必须逐个校验。
          # 顺便比对两个包的证书指纹，防止某个变体落到 debug key 上还混进更新通道。
          expected_digest=""
          verified=0
          for apk in dist/*.apk; do
            echo "── 校验 $(basename "$apk")"
            report="$("$APKSIGNER" verify --print-certs "$apk")"
            echo "$report"
            # 指纹前缀随 build-tools 版本变化（37.0.0 是「V2 Signer: certificate SHA-256 digest:」，
            # 老版本是「Signer #1 certificate ...」），所以只认中间那段固定文案，取去重后的唯一值。
            digests="$(printf '%s\n' "$report" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)"
            count="$(printf '%s\n' "$digests" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::$(basename "$apk") 解析到 $count 个签名证书，包可能未签名或多签名者"
              exit 1
            fi
            echo "   证书 SHA-256：$digests"
            if [ -z "$expected_digest" ]; then
              expected_digest="$digests"
            elif [ "$digests" != "$expected_digest" ]; then
              echo "::error::两个包的签名证书不一致：$digests ≠ $expected_digest"
              exit 1
            fi
            verified=$((verified + 1))
          done
          if [ "$verified" -eq 0 ]; then
            echo "::error::dist/ 下没有可校验的 APK"
            exit 1
          fi
          echo "签名校验通过（$verified 个包），证书 SHA-256：$expected_digest"

      # 同上：名字里写明「已签名 release 包」，与 debug 产物一眼区分。
      - name: 生成产物名
        id: naming
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/standard/release/Afdian-*-standard-release.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::standard release 产物应恰好 1 个，实际 ${#apks[@]} 个"
            exit 1
          fi
          file="${apks[0]##*/}"                       # Afdian-1.0.0-standard-release.apk
          version="${file#Afdian-}"                   # 1.0.0-standard-release.apk
          version="${version%-standard-release.apk}"  # 1.0.0
          echo "name=Afdian-${version}-signed-release-b${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 无论成败都清掉签名材料，避免被后续 step 或缓存带走
      - name: 清理签名材料
        if: always()
        run: rm -f key.properties release.jks

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### Actions 构建 #${{ github.run_number }}"
            echo ""
            echo "应用内「更新通道 = Actions 构建」会通过 Runs API 找到本次运行，"
            echo "点「查看构建」跳转到本页下载 artifact。artifact 需要登录 GitHub，App 不能匿名拉取。"
          } >> "$GITHUB_STEP_SUMMARY"
