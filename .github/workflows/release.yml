name: Release

# 正式发版：推一个 v* tag（或手动指定已存在的 tag），构建两个 edition 的签名包并发布 Release。
# 产出的 Release 必须是「非 draft、非 prerelease」—— 应用内检查更新查的是 /releases/latest，
# 草稿与预发布都会被 GitHub 跳过。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v1.2.3）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write          # gh release create 需要

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

jobs:
  publish:
    name: 打签名包并发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      INPUT_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      # fetch-depth: 0 —— --generate-notes 需要完整历史与上一个 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      # 版本号只有一个来源：app/build.gradle.kts 的 versionName。
      # tag 与它不一致就直接失败，避免「tag 写 1.2.0、包里是 1.1.0」这种检查更新永远看不到的坑。
      - name: 解析并校验版本
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.2.3，实际：$TAG"; exit 1
          fi
          VERSION="${TAG#v}"

          # 版本号默认值写在 `val resolvedVersionName = propText("versionName") ?: "1.0.0"`，
          # 而不是字面量 `versionName = "..."`。早先按后者 grep 什么也匹配不到，DECLARED 为空，
          # 会误报成「tag 与 versionName 不一致」把发版直接卡死。两种形态都认：
          # 优先取变量兜底值，匹配不到再退回字面量写法。
          DECLARED="$(sed -nE 's/.*propText\("versionName"\) *\?: *"([^"]+)".*/\1/p' app/build.gradle.kts | tr -d '\r')"
          if [ -z "$DECLARED" ]; then
            DECLARED="$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | tr -d '\r')"
          fi
          if [ -z "$DECLARED" ]; then
            echo "::error::没能从 app/build.gradle.kts 解析到 versionName 默认值（resolvedVersionName 那行改写法了？）"
            exit 1
          fi
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::tag $TAG 与 app/build.gradle.kts 的 versionName $DECLARED 不一致"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG" >/dev/null

          IFS='.' read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "已确认：tag=$TAG versionName=$VERSION versionCode=$CODE"

      - name: 校验签名 secrets
        run: |
          set -euo pipefail
          missing=()
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v:-}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 secrets: ${missing[*]}（配置方法见 README「CI 与发布」）"
            exit 1
          fi

      - name: 还原 keystore 与 key.properties
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | tr -d '\n\r \t' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          test -s release.jks

      # -x lintVital*：assembleRelease 默认挂 lintVital（Lint 全项目分析），是 release 独有的
      # 大头开销（debug 完全不跑）。这里跳过，release 只负责「R8 压缩 + 打包 + 签名」；
      # Lint 交给本地/IDE，别让每次发版都为一个静态检查多等一两分钟。
      - name: 打两个 edition 的签名包
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardRelease :app:assembleLegacyRelease \
            -x lintVitalStandardRelease -x lintVitalLegacyRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE" \
            -PbuildNumber=0 \
            -PbuildChannel=stable \
            -PgitSha="${GITHUB_SHA::7}" \
            --no-configuration-cache --stacktrace

      - name: 收集并校验签名
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p dist
          for edition in standard legacy; do
            cp "app/build/outputs/apk/${edition}/release/Afdian-${VERSION}-${edition}-release.apk" \
               "dist/Afdian-${VERSION}-${edition}-release.apk"
          done
          ls -l dist

          # ⚠️ apksigner verify 一次只接受一个 APK：把第二个文件传进去会被解析成
          #    「Unexpected parameter(s) after APK」并直接以 1 退出，所以必须逐个校验。
          # 顺便比对两个包的证书指纹，防止某个变体落到 debug key 上还发进 Release。
          expected_digest=""
          verified=0
          for apk in dist/*.apk; do
            echo "── 校验 $(basename "$apk")"
            report="$("$APKSIGNER" verify --print-certs "$apk")"
            echo "$report"
            # 指纹前缀随 build-tools 版本变化（37.0.0 是「V2 Signer: certificate SHA-256 digest:」，
            # 老版本是「Signer #1 certificate ...」），所以只认中间那段固定文案，取去重后的唯一值。
            digests="$(printf '%s\n' "$report" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)"
            count="$(printf '%s\n' "$digests" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::$(basename "$apk") 解析到 $count 个签名证书，包可能未签名或多签名者"
              exit 1
            fi
            echo "   证书 SHA-256：$digests"
            if [ -z "$expected_digest" ]; then
              expected_digest="$digests"
            elif [ "$digests" != "$expected_digest" ]; then
              echo "::error::两个包的签名证书不一致：$digests ≠ $expected_digest"
              exit 1
            fi
            verified=$((verified + 1))
          done
          if [ "$verified" -eq 0 ]; then
            echo "::error::dist/ 下没有可校验的 APK"
            exit 1
          fi
          echo "签名校验通过（$verified 个包），证书 SHA-256：$expected_digest"

      - name: 检查 Release 是否已存在
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请换版本号或先删除旧 Release"; exit 1
          fi

      - name: 创建 Release
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/Afdian-${VERSION}-standard-release.apk#标准版（Android 14+）" \
            "dist/Afdian-${VERSION}-legacy-release.apk#兼容版（Android 10–13）" \
            --title "$VERSION" \
            --generate-notes \
            --latest \
            --verify-tag

      - name: 清理签名材料
        if: always()
        run: rm -f key.properties release.jks
