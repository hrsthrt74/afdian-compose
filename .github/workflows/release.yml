name: Release

# 正式发版：推一个 v* tag（或手动指定已存在的 tag），构建两个 edition 的签名包并发布 Release。
# 产出的 Release 必须是「非 draft、非 prerelease」—— 应用内检查更新查的是 /releases/latest，
# 草稿与预发布都会被 GitHub 跳过。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v1.2.3）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write          # gh release create 需要

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

jobs:
  publish:
    name: 打签名包并发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      INPUT_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      # fetch-depth: 0 —— --generate-notes 需要完整历史与上一个 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      # 版本号只有一个来源：app/build.gradle.kts 的 versionName。
      # tag 与它不一致就直接失败，避免「tag 写 1.2.0、包里是 1.1.0」这种检查更新永远看不到的坑。
      - name: 解析并校验版本
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.2.3，实际：$TAG"; exit 1
          fi
          VERSION="${TAG#v}"

          DECLARED="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 \
                      | sed -E 's/.*"(.*)"/\1/' | tr -d '\r')"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::tag $TAG 与 app/build.gradle.kts 的 versionName $DECLARED 不一致"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG" >/dev/null

          IFS='.' read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "已确认：tag=$TAG versionName=$VERSION versionCode=$CODE"

      - name: 校验签名 secrets
        run: |
          set -euo pipefail
          missing=()
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v:-}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 secrets: ${missing[*]}（配置方法见 README「CI 与发布」）"
            exit 1
          fi

      - name: 还原 keystore 与 key.properties
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | tr -d '\n\r \t' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          test -s release.jks

      - name: 打两个 edition 的签名包
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardRelease :app:assembleLegacyRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE" \
            -PbuildNumber=0 \
            -PbuildChannel=stable \
            -PgitSha="${GITHUB_SHA::7}" \
            --no-configuration-cache --stacktrace

      - name: 收集并校验签名
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p dist
          for edition in standard legacy; do
            cp "app/build/outputs/apk/${edition}/release/Afdian-${VERSION}-${edition}-release.apk" \
               "dist/Afdian-${VERSION}-${edition}-release.apk"
          done
          ls -l dist
          "$APKSIGNER" verify --print-certs dist/*.apk

      - name: 检查 Release 是否已存在
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请换版本号或先删除旧 Release"; exit 1
          fi

      - name: 创建 Release
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/Afdian-${VERSION}-standard-release.apk#完整版（Android 14+）" \
            "dist/Afdian-${VERSION}-legacy-release.apk#低配兼容版（Android 10–13）" \
            --title "$VERSION" \
            --generate-notes \
            --latest \
            --verify-tag

      - name: 清理签名材料
        if: always()
        run: rm -f key.properties release.jks
